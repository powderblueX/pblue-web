apiVersion: apps/v1
kind: Deployment
metadata:
  name: pblue-web
  labels:
    app.kubernetes.io/name: pblue-web
    app.kubernetes.io/part-of: pblue-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pblue-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pblue-web
        app.kubernetes.io/part-of: pblue-lab
    spec:
      containers:
        - name: web
          image: pblue-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
